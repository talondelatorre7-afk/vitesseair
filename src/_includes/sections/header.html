<!-- ============================================ -->
<!--            VITESSE AIR HEADER                -->
<!-- ============================================ -->

<header id="cs-navigation">
    <div class="cs-container">
        <!-- LOGO -->
        <a href="/" class="cs-logo" aria-label="Vitesse Air Home">
            VITESSE<span>AIR</span>
        </a>
        
        <!-- NAV MENU -->
        <nav class="cs-nav" aria-label="main navigation">
            <button class="cs-toggle" id="cs-toggle" aria-expanded="false" aria-controls="cs-ul-wrapper" aria-label="mobile menu toggle" aria-haspopup="menu">
                <span class="cs-box" aria-hidden="true">
                    <span class="cs-line cs-line1" aria-hidden="true"></span>
                    <span class="cs-line cs-line2" aria-hidden="true"></span>
                    <span class="cs-line cs-line3" aria-hidden="true"></span>
                </span>
            </button>
            <div class="cs-ul-wrapper" id="cs-ul-wrapper" inert>
                <ul id="cs-expanded" class="cs-ul">
                    <li class="cs-li">
                        <a href="/" class="cs-li-link cs-active">Home</a>
                    </li>
                    <li class="cs-li">
                        <a href="/#capabilities" class="cs-li-link">Capabilities</a>
                    </li>
                    <li class="cs-li">
                        <a href="/#tarmac-spotlight" class="cs-li-link">Tarmac Logistics</a>
                    </li>
                    <li class="cs-li">
                        <a href="/#booking-portal" class="cs-li-link">Flight Portal</a>
                    </li>
                </ul>
            </div>
        </nav>
        
        <!-- DESKTOP CTA BUTTON -->
        <a href="/#booking-portal" class="header-cta cs-hide-on-mobile">Request Flight</a>
    </div>
</header>

<!-- FIXED SCRIPT WITH MOBILE-ONLY INERT CHECK -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const nav = document.getElementById('cs-navigation');
        const toggle = document.getElementById('cs-toggle');
        const wrapper = document.getElementById('cs-ul-wrapper');
        const isMobile = () => window.matchMedia('(max-width: 1023.5px)').matches;

        if (toggle && nav) {
            toggle.addEventListener('click', () => {
                nav.classList.toggle('cs-active');
                const isExpanded = toggle.getAttribute('aria-expanded') === 'true';
                toggle.setAttribute('aria-expanded', !isExpanded);
                if (wrapper && isMobile()) wrapper.inert = isExpanded;
            });

            // Close menu and toggle inert only on mobile when a link is clicked
            document.querySelectorAll('.cs-li-link').forEach(link => {
                link.addEventListener('click', () => {
                    if (isMobile()) {
                        nav.classList.remove('cs-active');
                        toggle.setAttribute('aria-expanded', 'false');
                        if (wrapper) wrapper.inert = true;
                    }
                });
            });
        }
    });
</script>
